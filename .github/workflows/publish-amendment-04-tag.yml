name: Publish amendment-04 tag

on:
  push:
    branches:
      - tmp/amendment-04-tag
    paths:
      - .github/workflows/publish-amendment-04-tag.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish amendment-04 tag
        env:
          TARGET_SHA: f6243fa36784ecc88af2259bedc2b121a25f357d
          TAG_NAME: amendment-04
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag exists; refusing to move it."
            exit 0
          fi
          git cat-file -e "$TARGET_SHA^{commit}"
          git tag "$TAG_NAME" "$TARGET_SHA"
          git push origin "refs/tags/$TAG_NAME"
