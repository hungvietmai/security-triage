name: Publish amendment-03 tag

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-amendment-03-tag.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create amendment-03 tag
        env:
          TARGET_SHA: 67ef4e4c1d94f71eac6ffcee06ffff353bb8790f
          TAG_NAME: amendment-03
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists; refusing to move it."
            exit 0
          fi
          git cat-file -e "$TARGET_SHA^{commit}"
          git tag "$TAG_NAME" "$TARGET_SHA"
          git push origin "refs/tags/$TAG_NAME"
