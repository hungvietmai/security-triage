name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install policy and pair manifest parsers
        run: python -m pip install pyyaml==6.0.3 -r experiments/requirements-pairs.txt
      - name: Install pinned JavaScript AST locator
        run: npm --prefix experiments/locators ci --ignore-scripts
      - name: Run experiment tests
        run: PYTHONPATH=backend python -m unittest discover -s experiments/tests -p 'test_*.py' -v

  reconciliation-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build pinned experiment image
        run: docker build -f experiments/Dockerfile -t security-triage-pilot:day3 .
      - name: Run priority v0.1 on both curling configurations, R1 and OWASP Python
        run: |
          set -euo pipefail
          mkdir -p /tmp/day3-artifacts
          COMMIT="$(git rev-parse HEAD)"
          docker run --rm \
            -v /tmp/day3-artifacts:/app/artifacts \
            security-triage-pilot:day3 \
            --case experiments/cases/secbench-curling-0.2.0.json \
            --config experiments/configs/development-smoke-javascript.json \
            --configuration-commit "$COMMIT" \
            --output artifacts/curling-baseline
          docker run --rm \
            -v /tmp/day3-artifacts:/app/artifacts \
            security-triage-pilot:day3 \
            --case experiments/cases/secbench-curling-0.2.0.json \
            --config experiments/configs/development-paired-direct-alias.json \
            --configuration-commit "$COMMIT" \
            --output artifacts/curling-paired-alias
          docker run --rm \
            -v /tmp/day3-artifacts:/app/artifacts \
            --entrypoint python \
            security-triage-pilot:day3 \
            experiments/diagnostics/probe_r1.py \
            --javascript-query-pack /opt/codeql/qlpacks/codeql/javascript-queries/2.4.6 \
            --output artifacts/r1-priority
          docker run --rm \
            -v /tmp/day3-artifacts:/app/artifacts \
            security-triage-pilot:day3 \
            --case experiments/cases/owasp-benchmarkpython-cwe78-v01.json \
            --config experiments/configs/development-owasp-python-upstream.json \
            --configuration-commit "$COMMIT" \
            --output artifacts/owasp-python-priority
          docker run --rm \
            -v /tmp/day3-artifacts:/app/artifacts \
            --entrypoint python \
            security-triage-pilot:day3 \
            experiments/diagnostics/priority_owasp_summary.py \
            --run-directory artifacts/owasp-python-priority
      - name: Verify reconciliation and priority acceptance criteria
        run: |
          set -euo pipefail
          git fetch --depth=1 origin tmp/scanner-refactor-baseline
          git show FETCH_HEAD:experiments/tmp/pre-refactor-curling/findings.json > /tmp/step1-findings.json
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/day3-artifacts")
          old = json.loads(Path("/tmp/step1-findings.json").read_text())
          new = json.loads((root / "curling-baseline/findings.json").read_text())
          def identity(row):
              return row["raw_id"], row["tool"], row["rule_id"], row["reported_path"], row["reported_region"]
          assert [identity(row) for row in old] == [identity(row) for row in new]
          approved_unit = "58114fb901d995f4d95d948c211ef89b82117648db9a34447f2d5fc7e48dfdcb"

          baseline_run = json.loads((root / "curling-baseline/run.json").read_text())
          baseline_units = json.loads((root / "curling-baseline/units.json").read_text())
          assert baseline_run["status"] == "completed", baseline_run
          assert baseline_run["raw_findings"] == 6, baseline_run
          assert baseline_run["steps"]["semgrep"]["raw_findings"] == 0, baseline_run
          assert baseline_run["steps"]["codeql"]["raw_findings"] == 6, baseline_run
          assert len(baseline_units) == 1, baseline_units
          baseline_assessments = json.loads((root / "curling-baseline/assessments.json").read_text())
          assert len(baseline_assessments) == 1
          assert baseline_assessments[0]["priority"] == "P1", baseline_assessments
          assert baseline_assessments[0]["predicate_values"]["strong_flow"], baseline_assessments
          assert baseline_assessments[0]["source_types"] == ["library_input"]
          assert baseline_units[0]["unit_id"] == approved_unit, baseline_units
          assert baseline_units[0]["tools"] == ["codeql"], baseline_units
          assert sum(len(unit["raw_finding_ids"]) for unit in baseline_units) == baseline_run["raw_findings"]

          paired_run = json.loads((root / "curling-paired-alias/run.json").read_text())
          paired_units = json.loads((root / "curling-paired-alias/units.json").read_text())
          assert paired_run["status"] == "completed", paired_run
          assert paired_run["steps"]["semgrep"]["raw_findings"] == 1, paired_run
          assert paired_run["steps"]["codeql"]["raw_findings"] == 6, paired_run
          assert paired_run["raw_findings"] == 7, paired_run
          assert len(paired_units) == 1, paired_units
          paired_assessments = json.loads((root / "curling-paired-alias/assessments.json").read_text())
          assert len(paired_assessments) == 1 and paired_assessments[0]["priority"] == "P1"
          assert paired_assessments[0]["predicate_values"]["agreement"]
          assert paired_units[0]["unit_id"] == approved_unit, paired_units
          assert paired_units[0]["tools"] == ["codeql", "semgrep"], paired_units
          assert len(paired_units[0]["raw_finding_ids"]) == 7, paired_units
          assert sum(len(unit["raw_finding_ids"]) for unit in paired_units) == paired_run["raw_findings"]

          print(json.dumps({
              "raw_ids_rules_primary_locations_equal": True,
              "baseline_priority": baseline_assessments[0]["priority"],
              "paired_priority": paired_assessments[0]["priority"],
              "baseline_raw_findings": baseline_run["raw_findings"],
              "baseline_units": len(baseline_units),
              "paired_raw_findings": paired_run["raw_findings"],
              "paired_tools": paired_units[0]["tools"],
              "paired_units": len(paired_units),
              "unit_id": paired_units[0]["unit_id"],
          }, indent=2))
          PY

  scan-parity:
    # Heavy: the scanner worker image and the experiment image, each with CodeQL.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Run the CLI on curling with the scan profile's JavaScript configuration
        run: |
          set -euo pipefail
          mkdir -p /tmp/parity
          docker build -f experiments/Dockerfile -t security-triage-pilot:parity .
          docker run --rm -v /tmp/parity:/app/artifacts security-triage-pilot:parity             --case experiments/cases/secbench-curling-0.2.0.json             --config experiments/configs/development-batch-01-upstream.json             --configuration-commit "$(git rev-parse HEAD)"             --output artifacts/cli
      - name: Start the stack with the scanner worker
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: Scan curling through the API and require the CLI's result
        run: |
          python3 experiments/diagnostics/scan_parity.py             --api http://localhost:8000             --case experiments/cases/secbench-curling-0.2.0.json             --cli-run /tmp/parity/cli             --output /tmp/parity/report.json             --expect-tier P1=1
      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color --tail=200 api worker
      - name: Stop services
        if: always()
        run: docker compose down --volumes

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Check generated API types match openapi.json
        run: |
          npm run gen:api
          git diff --exit-code -- src/types/api-schema.d.ts
      - run: npm test
      - run: npm run build

  docker-integration:
    runs-on: ubuntu-latest
    # The worker image downloads and verifies the pinned CodeQL bundle.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configurations
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.dev.yaml config --quiet
      - name: Start the complete stack
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Test API with isolated PostgreSQL schemas
        run: docker compose --profile test run --build --rm test
      - name: Lint and type-check Python
        run: |
          docker compose --profile test run --rm --no-deps test ruff check .
          docker compose --profile test run --rm --no-deps test ruff format --check .
          docker compose --profile test run --rm --no-deps test mypy
      - name: Audit Python dependencies for known vulnerabilities
        run: docker compose --profile test run --rm --no-deps test pip-audit --progress-spinner off
      - name: Check migrations match models and downgrade cleanly
        run: |
          docker compose exec -T api alembic check
          docker compose exec -T api alembic downgrade base
          docker compose exec -T api alembic upgrade head
          docker compose exec -T api alembic check
      - name: Check frontend/openapi.json matches the API
        run: |
          docker compose exec -T api python -m scripts.export_openapi > frontend/openapi.json
          git diff --exit-code -- frontend/openapi.json
      - name: Verify worker scanner versions and scan profile hashes
        run: docker compose exec -T worker python -m scripts.check_worker
      - name: Verify FE proxy, readiness and worker
        run: |
          curl --fail --retry 5 --retry-delay 2 http://localhost:5173/
          curl --fail http://localhost:5173/api/v1/health/ready
          docker compose exec -T worker celery -A app.workers.celery_app:celery_app inspect ping --timeout 10
      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop CI services
        if: always()
        run: docker compose down --volumes
