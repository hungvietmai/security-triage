name: Temporary step 5 tests

on:
  push:
    branches:
      - tmp/step5-tests-step6-compare
    paths:
      - experiments/**
      - backend/**
      - .github/workflows/tmp-step5-tests.yml

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install uv
          uv sync --locked
      - name: Backend lint types and tests
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest --cov
      - name: Run experiment runner tests
        env:
          PYTHONPATH: backend
        run: python -m unittest experiments.test_runner -v
      - name: Discover split tests
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s experiments/tests -t . -v
