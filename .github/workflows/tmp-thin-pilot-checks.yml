name: Temporary thin pilot checks

on:
  push:
    branches:
      - tmp/thin-pilot-step3-4
    paths:
      - experiments/**
      - backend/app/scanners/**
      - .github/workflows/tmp-thin-pilot-checks.yml

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install uv
          uv sync --locked
      - name: Backend lint and types
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
      - name: Backend tests
        working-directory: backend
        run: uv run pytest --cov
      - name: Experiment runner tests
        env:
          PYTHONPATH: backend
        run: python -m unittest experiments.test_runner
