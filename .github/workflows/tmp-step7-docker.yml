name: Temporary step 7 experiment Docker

on:
  push:
    branches:
      - tmp/step7-experiment-docker
    paths:
      - .github/workflows/tmp-step7-docker.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/triage-hermetic-fixtures
      - name: Validate Compose configurations
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.dev.yaml config --quiet
      - name: Start the complete stack
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Test API with isolated PostgreSQL schemas
        run: docker compose --profile test run --build --rm test
      - name: Lint and type-check Python
        run: |
          docker compose --profile test run --rm --no-deps test ruff check .
          docker compose --profile test run --rm --no-deps test ruff format --check .
          docker compose --profile test run --rm --no-deps test mypy
      - name: Stop CI services
        if: always()
        run: docker compose down --volumes
