name: Temporary step 7 experiment Docker

on:
  push:
    branches:
      - tmp/step7-experiment-docker
    paths:
      - .github/workflows/tmp-step7-docker.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/triage-sink-locator-v0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          python -m pip install "semgrep==1.178.0"
      - name: Run JavaScript sink locator
        run: |
          set -euo pipefail
          semgrep scan --metrics=off --disable-version-check --no-git-ignore \
            --json \
            --config experiments/locators/sink-locator-v0-javascript.yaml \
            experiments/fixtures/r1-feasibility \
            experiments/fixtures/direct-alias \
            > /tmp/sinks.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("/tmp/sinks.json").read_text())
          rows=[
              {
                  "check_id": r["check_id"],
                  "path": r["path"],
                  "start": r["start"],
                  "end": r["end"],
                  "lines": r["extra"].get("lines"),
                  "metavars": r["extra"].get("metavars", {}),
              }
              for r in data["results"]
          ]
          print(json.dumps({"count":len(rows),"rows":rows}, indent=2))
          PY
