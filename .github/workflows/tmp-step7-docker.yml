name: Temporary step 7 experiment Docker

on:
  push:
    branches:
      - tmp/step7-experiment-docker
    paths:
      - .github/workflows/tmp-step7-docker.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/triage-backend-fixture
      - name: Start stack
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Re-run backend tests inside Docker test image
        run: docker compose --profile test run --build --rm test
      - name: Stop stack
        if: always()
        run: docker compose down --volumes
