[project]
name = "security-triage-backend"
version = "0.1.0"
description = "FastAPI foundation for evidence-based Semgrep and CodeQL triage"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "celery[redis]>=5.5,<6",
  "boto3>=1.36,<2",
]

[dependency-groups]
dev = [
    "celery-types>=0.26,<1",
    "httpx2>=2.13,<3",
    "mypy>=2.3,<3",
    "pip-audit>=2.10,<3",
    "pytest>=8,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.11,<1",
    "types-boto3[s3]>=1.43,<2",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
# Always import as app.<package>.<module>; see backend/AGENTS.md.
ban-relative-imports = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Test files mirror app/ and may share basenames (e.g. test_router.py).
addopts = ["--import-mode=importlib"]

[tool.coverage.run]
source = ["app", "scripts"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":', "if TYPE_CHECKING:"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "scripts", "migrations", "tests"]
# tests/ mirrors app/ without __init__.py files; map paths to module names.
explicit_package_bases = true

[[tool.mypy.overrides]]
# Tests stay type-checked, but pytest fixtures need not be annotated.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
